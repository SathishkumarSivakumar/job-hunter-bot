name: Autonomous Job Hunter Pipeline

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST daily
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  run-autonomous-hunter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Network & Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Autonomous Job Hunter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python autonomous_engine.py
